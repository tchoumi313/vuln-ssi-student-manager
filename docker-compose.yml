# LevelUp.dev — Production docker-compose
# Location on VPS: /opt/buildupdev/app/docker-compose.yml
# Database: MongoDB — running as container in this file
# Proxy: Traefik (separate stack in /opt/buildupdev/traefik/)

services:
  mongo:
    image: mongo:7
    container_name: buildupdev-ssi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ssi-student-manager
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ssibackend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildupdev-ssibackend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/ssi-student-manager}
      FRONTEND_URL: ${FRONTEND_URL:-https://ssi.buildupdev.com}
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - traefik-net
      - internal
    labels:
      - "traefik.enable=true"
      # API routes → ssibackend
      - "traefik.http.routers.ssibackend.rule=(Host(`ssiapi.buildupdev.com`) || Host(`ssi.buildupdev.com`)) && PathPrefix(`/api`)"
      - "traefik.http.routers.ssibackend.entrypoints=websecure"
      - "traefik.http.routers.ssibackend.tls.certresolver=letsencrypt"
      - "traefik.http.services.ssibackend.loadbalancer.server.port=5000"
      - "traefik.docker.network=traefik-net"

  ssifrontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://ssiapi.buildupdev.com/api}
    container_name: buildupdev-ssifrontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik-net
    depends_on:
      - ssibackend
    labels:
      - "traefik.enable=true"
      # All other routes → ssifrontend
      - "traefik.http.routers.ssifrontend.rule=Host(`ssi.buildupdev.com`)"
      - "traefik.http.routers.ssifrontend.entrypoints=websecure"
      - "traefik.http.routers.ssifrontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ssifrontend.priority=1"
      - "traefik.http.services.ssifrontend.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-net"

volumes:
  mongo_data:

networks:
  traefik-net:
    external: true   # shared with Traefik and n8n
  internal:
    driver: bridge   # backend-only network (not exposed to Traefik)
